</style></head><body><main class="page"><div class="top"><div class="brand">拾光 · 手账本</div><a class="back" href="index.html">← 返回 AI 日记</a></div><div class="eyebrow">A NOTEBOOK MADE FROM YOUR DAYS</div><h1 class="title">你的生活，<br>值得被装订。</h1><p class="sub">每天的日记会自动变成一本可爱的手账。</p><div class="date" id="date"></div><section class="paper"><label class="label">今天的主题</label><input class="input" id="title" placeholder="例如：春天终于来了"><div class="columns"><div class="block yellow"><h3>☀️ 今日待办</h3><ul class="todo-list" id="todoList"></ul><div class="todo-add"><input id="todoInput" placeholder="添加一件小事"><button onclick="addTodo()">＋</button></div></div><div class="block blue"><h3>💌 给自己的话</h3><textarea class="area" id="note" placeholder="今天想感谢什么？&#10;有什么值得记住？"></textarea></div></div><section class="mindful"><h3>🌿 正念一分钟</h3><div class="breath" id="breath">准备好</div><p>吸气 4 秒 · 停留 4 秒 · 呼气 4 秒<br>不需要改变什么，只要陪自己待一会儿。</p><button onclick="startBreath()" style="display:block;margin:10px auto;border:0;background:#718f69;color:#fff;padding:8px 14px;border-radius:99px;cursor:pointer">开始练习</button><div class="feelings"><button class="feel active" onclick="pickFeel(this,'平静')">☁️ 平静</button><button class="feel" onclick="pickFeel(this,'紧张')">🌧️ 紧张</button><button class="feel" onclick="pickFeel(this,'疲惫')">🌙 疲惫</button><button class="feel" onclick="pickFeel(this,'有能量')">☀️ 有能量</button></div></section><label class="label">选择一枚今日贴纸</label><div class="sticker-row"><button class="sticker active" onclick="pickSticker(this,'🌷')">🌷</button><button class="sticker" onclick="pickSticker(this,'☁️')">☁️</button><button class="sticker" onclick="pickSticker(this,'🍰')">🍰</button><button class="sticker" onclick="pickSticker(this,'✨')">✨</button><button class="sticker" onclick="pickSticker(this,'🌈')">🌈</button></div><div class="actions"><button class="cancel" onclick="clearPlan()">清空</button><button class="save" onclick="savePlan()">保存这页手账 →</button></div><button class="auto" onclick="autoGenerate()">✦ 用今天的日记自动生成手账</button><div class="saved" id="saved">✓ 这页手账已保存在你的设备上</div></section><div class="book-head"><div><h2>我的手账本</h2><p>自动收集每一天的文字、心情和照片</p></div><span id="count" style="color:#ef7d70;font-size:12px"></span></div><section class="book" id="book"></section></main><script>const d=new Date(),pad=n=>String(n).padStart(2,'0');document.querySelector('#date').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · ${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()]}`;let sticker='🌷',feeling='平静',todos=[],breathing=false;function renderTodos(){document.querySelector('#todoList').innerHTML=todos.map((x,i)=>`<li class="${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="toggleTodo(${i})"><span>${x.text}</span><button onclick="removeTodo(${i})" style="margin-left:auto;border:0;background:transparent;color:#b9ada0;cursor:pointer">×</button></li>`).join('')}function addTodo(){const i=document.querySelector('#todoInput'),v=i.value.trim();if(!v)return;todos.push({text:v,done:false});i.value='';renderTodos()}function toggleTodo(i){todos[i].done=!todos[i].done;renderTodos()}function removeTodo(i){todos.splice(i,1);renderTodos()}function pickFeel(el,v){feeling=v;document.querySelectorAll('.feel').forEach(x=>x.classList.remove('active'));el.classList.add('active')}function pickSticker(el,v){sticker=v;document.querySelectorAll('.sticker').forEach(x=>x.classList.remove('active'));el.classList.add('active')}function startBreath(){if(breathing)return;breathing=true;const b=document.querySelector('#breath');let n=0;b.classList.add('running');const timer=setInterval(()=>{n++;b.textContent=n%2?'吸气':'呼气';b.classList.toggle('running');if(n>=6){clearInterval(timer);breathing=false;b.textContent='完成'}},4000)}function savePlan(){localStorage.setItem('shiguang-planner',JSON.stringify({title:document.querySelector('#title').value,todos,note:document.querySelector('#note').value,sticker,feeling}));showSaved()}function showSaved(){document.querySelector('#saved').classList.add('show');setTimeout(()=>document.querySelector('#saved').classList.remove('show'),2500)}function clearPlan(){document.querySelector('#title').value='';document.querySelector('#note').value='';todos=[];renderTodos()}function autoGenerate(){const list=JSON.parse(localStorage.getItem('shiguang-entries')||'[]'),e=list[0];if(!e)return alert('先去 AI 日记里记录今天，再来生成手账吧。');document.querySelector('#title').value=e.text.split(/[。！？.!?]/)[0].slice(0,24)||'今天也有好好生活';document.querySelector('#note').value=`今天的心情是：${e.mood}\n\n${e.text}`;todos=[];if(e.tags?.length)e.tags.forEach(t=>todos.push({text:`回顾：${t}`,done:false}));renderTodos();if(e.photos?.length)document.querySelector('#note').value+=`\n\n📷 今天还留下了 ${e.photos.length} 张照片。`;showSaved()}function renderBook(){const list=JSON.parse(localStorage.getItem('shiguang-entries')||'[]'),book=document.querySelector('#book');document.querySelector('#count').textContent=`${list.length} 页`;if(!list.length){book.innerHTML='<div class="empty-book">还没有自动生成的页面。<br>去 AI 日记记录一天，回来就会看到它出现在手账本里。</div>';return}book.innerHTML=list.map((e,i)=>`<article class="entry-page"><span class="page-sticker">${['🌷','✨','☁️','🍰','🌈'][i%5]}</span><div class="entry-date">${e.display}</div><span class="entry-mood">${e.mood||'平静'}</span><h3>${(e.text||'今天也有好好生活').split(/[。！？.!?]/)[0].slice(0,24)}</h3><p>${(e.text||'').slice(0, ninety=90)}${e.text.length>90?'……':''}</p><div class="entry-tags">${(e.tags||[]).map(t=>'#'+t).join(' ')}</div>${e.photos?.length?e.photos.slice(0,3).map(s=>`<img class="entry-photo" src="${s}">`).join(''):''}</article>`).join('')}const p=JSON.parse(localStorage.getItem('shiguang-planner')||'null');if(p){document.querySelector('#title').value=p.title||'';document.querySelector('#note').value=p.note||'';todos=p.todos||[];sticker=p.sticker||'🌷';feeling=p.feeling||'平静';renderTodos()}renderBook();</script></body></html>
